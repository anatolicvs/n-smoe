[project]
name = "n-smoe-dev"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "Pixi environment for N-SMoE research stack (GPU, tests, optional extras)"

[tool.pixi.project]
channels = ["conda-forge", "nvidia"]
platforms = ["linux-64"]

[tool.pixi.system-requirements]
cuda = "12.9"

[tool.pixi.dependencies]
python = "3.12.*"
pip = "*"
python-build = "*"
cmake = "*"
ninja = "*"
numpy = "*"
pyyaml = "*"
numba = "*"
llvmlite = "*"
cython = "*"

[tool.pixi.pypi-options]
index-url = "https://pypi.org/simple"
find-links = [{ url = "https://storage.googleapis.com/jax-releases/jax_cuda_releases.html" }]
index-strategy = "first-index"
["https://pypi.nvidia.com"]
find-links = [{ url = "https://storage.googleapis.com/jax-releases/jax_cuda_releases.html" }]
index-strategy = "unsafe-best-match"

[tool.pixi.pypi-dependencies]
# PyTorch CUDA wheels: use cu126 to satisfy monai>=1.5 torch range (>=2.4.1,<2.7.0)
torch = { version = ">=2.6,<2.7", index = "https://download.pytorch.org/whl/cu124" }
torchvision = { version = ">=0.21,<0.22", index = "https://download.pytorch.org/whl/cu124" }
torchaudio = { version = ">=2.6,<2.7", index = "https://download.pytorch.org/whl/cu124" }
xformers = { version = "*", index = "https://download.pytorch.org/whl/cu124" }

scipy = "*"
einops = "*"
tqdm = "*"
pandas = "*"
scikit-learn = "*"
timm = "*"
tensorboard = "*"
hydra-core = "*"
"fvcore" = "*"

[tool.pixi.feature.test.pypi-dependencies]
pytest = "*"
pytest-cov = "*"
pytest-mock = "*"
pytest-github-actions-annotate-failures = "*"
coverage = "*"
black = "*"
ruff = "*"
flake8 = "*"
flake8-bugbear = "*"
flake8-docstrings = "*"
flake8-formatter-junit-xml = "*"
flake8-pyproject = "*"
pylint = "*"
pylint-junit = "*"
bandit = { version = "*", extras = ["toml"] }
pre-commit = "*"

[tool.pixi.feature.test.tasks]
test = "pytest -m 'not integration and not spark' --cov-report xml:coverage.xml --cov src --cov-fail-under 0"
integration = "pytest -m integration"
spark = "pytest -m spark"
all = "pytest"
format = "black src"
flake8 = "flake8"
pylint = "pylint src"
precommit = "pre-commit run -a"

[tool.pixi.feature.extras.pypi-dependencies]
opencv-python = "*"
rawpy = "*"
imageio = "*"
"imageio-ffmpeg" = "*"
scikit-image = "*"
beartype = "*"
colorama = "*"
moviepy = "*"
dacite = "*"
tabulate = "*"
"svg.py" = "*"
h5py = "*"
plyfile = "*"
e3nn = "*"
lpips = "*"
colorspacious = "*"
thop = "*"
wandb = "*"
lightning = "*"
"pytorch-metric-learning" = "*"
"pytorch-ignite" = "*"
"pytorchvideo" = "*"
"torchmetrics" = "*"
"pytorch-msssim" = "*"
torchio = "*"
piq = "*"
"torchdiffeq" = "*"
flax = "*"
jaxtyping = "*"
"jax" = { version = "*", extras = ["cuda12_local"] }
"cupy-cuda12x" = "*"
diffusers = { version = "*", extras = ["torch"] }
"connected-components-3d" = "*"
commentjson = "*"
nltk = "*"
transformers = "*"
sentencepiece = "*"
spacy = "*"
torchtext = "*"
torchdata = "*"
portalocker = ">=2.0.0"
nibabel = "*"
"dicom2nifti" = "*"
hdf5storage = "*"
pydicom = "*"
SimpleITK = "*"
monai = ">=1.5,<1.6"
"gsplat" = "*"
"segmentation-models-pytorch" = "*"
"ruamel.yaml" = "*"
"nerfview" = "*"
"viser" = "*"
"iopath" = "*"
"mahotas" = "*"
"datashader" = "*"
"holoviews" = "*"
"hvplot" = "*"
jupyterlab = "*"
icecream = "*"
"dahuffman" = "*"
"vector-quantize-pytorch" = "*"

[tool.pixi.environments]
default = { features = [] }
test = { features = ["test"] }
extras = { features = ["extras"] }

[tool.pixi.tasks]
info = "python -c \"import torch, sys; print(torch.__version__); print('CUDA available:', torch.cuda.is_available());\""
lab = { cmd = "jupyter lab" }

[tool.pytest.ini_options]
addopts = "--cov-report xml:coverage.xml --cov src --cov-fail-under 0 -m 'not integration'"
pythonpath = ["src"]
testpaths = "tests"
junit_family = "xunit2"
markers = [
  "integration: marks as integration test",
  "notebooks: marks as notebook test",
  "gpu: marks as gpu test",
  "spark: marks tests which need Spark",
  "slow: marks tests as slow",
  "unit: fast offline tests"
]

[tool.coverage.run]
branch = false

[tool.coverage.report]
fail_under = 100

[tool.black]
line-length = 120
fast = true

[tool.flake8]
max-line-length = 120
select = "F,E,W,B,B901,B902,B903"
exclude = [".eggs",".git",".tox","nssm","obj","out","packages","pywin32","tests","swagger_client"]
ignore = ["E722","B001","W503","E203"]

[tool.ruff.lint]
select = ["E","F","B","I"]
ignore = ["E501"]

[tool.pylint]
extension-pkg-whitelist = ["numpy","torch","cv2","pyodbc","pydantic","ciso8601","netcdf4","scipy"]
ignore = "CVS"
ignore-patterns = "test.*?py,conftest.py"
init-hook = "import sys; sys.setrecursionlimit(8 * sys.getrecursionlimit())"
jobs = 0
limit-inference-results = 100
persistent = "yes"
suggestion-mode = "yes"
unsafe-load-any-extension = "no"

[tool.pylint."MESSAGES CONTROL"]
enable = "c-extension-no-member"

[tool.pylint."REPORTS"]
evaluation = "10.0 - ((float(5 * error + warning + refactor + convention) / statement) * 10)"
output-format = "text"
reports = "no"
score = "yes"

[tool.pylint."FORMAT"]
indent-after-paren = 4
indent-string = "    "
max-line-length = 120
max-module-lines = 1000
single-line-class-stmt = "no"
single-line-if-stmt = "no"

[tool.mypy]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
extra_checks = true
check_untyped_defs = true
disallow_subclassing_any = true
disallow_any_generics = true
disallow_untyped_decorators = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_reexport = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "torchvision.*"
ignore_missing_imports = true